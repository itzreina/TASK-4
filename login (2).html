<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Chat - Login & Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #075e54; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: 600; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 10px; background: #075e54; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #128c7e; }
        .toggle-text { text-align: center; margin-top: 15px; color: #555; font-size: 14px; cursor: pointer; }
        .toggle-text span { color: #075e54; font-weight: bold; text-decoration: underline; }
        .error-msg { color: red; text-align: center; margin-bottom: 10px; font-size: 14px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="form-title">Chat Login</h2>
    <div class="error-msg" id="error-box"></div>
    
    <form id="auth-form">
        <div class="form-group" id="name-group" style="display: none;">
            <label>Full Name</label>
            <input type="text" id="username" placeholder="Enter your name">
        </div>
        
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>
        
        <button type="submit" id="submit-btn">Login</button>
    </form>

    <div class="toggle-text" id="toggle-link">
        Don't have an account? <span id="toggle-action">Register here</span>
    </div>
</div>

<script>
    const formTitle = document.getElementById('form-title');
    const nameGroup = document.getElementById('name-group');
    const submitBtn = document.getElementById('submit-btn');
    const toggleAction = document.getElementById('toggle-action');
    const toggleLink = document.getElementById('toggle-link');
    const errorBox = document.getElementById('error-box');
    const authForm = document.getElementById('auth-form');

    let isLoginMode = true;

    // Toggle between Login and Register views
    toggleLink.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            formTitle.innerText = "Chat Login";
            nameGroup.style.display = "none";
            document.getElementById('username').removeAttribute('required');
            submitBtn.innerText = "Login";
            toggleLink.innerHTML = 'Don\'t have an account? <span>Register here</span>';
        } else {
            formTitle.innerText = "Create Account";
            nameGroup.style.display = "block";
            document.getElementById('username').setAttribute('required', 'true');
            submitBtn.innerText = "Register";
            toggleLink.innerHTML = 'Already have an account? <span>Login here</span>';
        }
        errorBox.style.display = "none";
    });

    // Handle authentication form submission
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = "none";

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const username = document.getElementById('username').value;

        const endpoint = isLoginMode ? '/api/login' : '/api/register';
        const payload = isLoginMode ? { email, password } : { username, email, password };

        try {
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();

            if (res.ok) {
                window.location.href = '/';
            } else {
                errorBox.innerText = data.error || "Something went wrong";
                errorBox.style.display = "block";
            }
        } catch (err) {
            errorBox.innerText = "Server error. Try again.";
            errorBox.style.display = "block";
        }
    });
</script>
</body>
</html>
